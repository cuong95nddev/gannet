[package]
name = "gannet-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Screen grabs, markup and export for Gannet, without any UI."

[dependencies]
aes-gcm = { version = "0.10", features = ["zeroize"] }
ab_glyph = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"

# Grabbing the screen with ScreenCaptureKit (macOS 14+), falling back to
# `screencapture` before that.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = { version = "0.3.2", features = ["CGImage", "CGContext", "CGBitmapContext", "CGColorSpace", "CGDirectDisplay", "CGGeometry"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSError", "NSProcessInfo"] }
objc2-screen-capture-kit = { version = "0.3.2", features = ["SCShareableContent", "SCScreenshotManager", "SCStream", "block2", "objc2-core-graphics"] }
