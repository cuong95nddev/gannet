[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.2.1"
license = "MIT"

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# Stitching a scrolling capture walks every pixel of each frame; unoptimised
# it is too slow to keep up with the scrolling.
[profile.dev.package.gannet-core]
opt-level = 2
